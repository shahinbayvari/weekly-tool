<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accept invite</title>
</head>
<body>
  <h1>Join the team</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/invite/{{ token }}">
    <label>Email <input type="email" name="email_display" value="{{ email }}" readonly autocomplete="username"></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" required></label>
    <label>Confirm password <input type="password" name="confirm_password" autocomplete="new-password" required></label>
    <button type="submit">Create account</button>
  </form>
</body>
</html>
