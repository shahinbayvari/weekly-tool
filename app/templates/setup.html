<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up</title>
</head>
<body>
  <h1>Set up your project</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/setup"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Project name <input type="text" name="project_name" value="{{ project_name }}" required></label>
    <label>Email <input type="email" name="email" value="{{ email }}" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" required></label>
    <label>Confirm password <input type="password" name="confirm_password" autocomplete="new-password" required></label>
    <button type="submit">Create owner account</button>
  </form>
</body>
</html>
