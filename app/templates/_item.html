<li id="item-{{ item.id }}">
  <span class="text">{{ item.text }}</span>
  {% if editable %}
  <button type="button" hx-get="/submit/items/{{ item.id }}/edit" hx-target="#item-{{ item.id }}" hx-swap="outerHTML">Edit</button>
  <button type="button" hx-post="/submit/items/{{ item.id }}/delete" hx-target="#list-{{ item.category }}" hx-swap="outerHTML">Delete</button>
  <button type="button" class="anonymous-toggle" aria-pressed="{{ 'true' if item.anonymous else 'false' }}"
          hx-post="/submit/items/{{ item.id }}/anonymous" hx-vals='{"anonymous": "{{ 'false' if item.anonymous else 'true' }}"}'
          hx-target="#item-{{ item.id }}" hx-swap="outerHTML">Anonymous: {{ 'on' if item.anonymous else 'off' }}</button>
  {% else %}
  <span class="anonymous-state">Anonymous: {{ 'on' if item.anonymous else 'off' }}</span>
  {% endif %}
</li>
