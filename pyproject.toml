[project]
name = "weekly-tool"
version = "0.1.0"
description = "Weekly Start/Stop/Continue feedback tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "tzdata",
    "sqlalchemy>=2.1.9",
    "alembic>=1.20.1",
    "argon2-cffi",
    "jinja2",
    "itsdangerous",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
